# Dev override: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
services:
  db:
    ports:
      - "127.0.0.1:5432:5432"

  app:
    build:
      target: dev
    # Host uid/gid so files created in the bind mount (e.g. new migrations) stay owned by you
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    volumes:
      - ./backend:/app

  # Vite dev server (Phase 3): http://127.0.0.1:5173, /api proxied to the backend
  frontend:
    image: node:22-bookworm-slim
    working_dir: /app
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      API_PROXY_TARGET: http://app:8000
      HOME: /tmp
      npm_config_cache: /tmp/.npm
    volumes:
      - ./frontend:/app
    command: sh -c "[ -d node_modules ] || npm ci; exec npm run dev"
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - app
