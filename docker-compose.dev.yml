# Dev override: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
services:
  db:
    ports:
      - "127.0.0.1:5432:5432"

  app:
    build:
      target: dev
    # Host uid/gid so files created in the bind mount (e.g. new migrations) stay owned by you
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    volumes:
      - ./backend:/app
