[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
# DTZ enforces timezone-aware datetimes (docs/SPEC.md §3, "Time")
select = ["E", "F", "W", "I", "B", "UP", "DTZ", "SIM", "RUF"]
# Czech copy uses typographic dashes ("pondělí–neděle", "12.–18.10.")
ignore = ["RUF001"]

[tool.ruff.lint.per-file-ignores]
# Autogenerated migrations carry long CHECK constraint strings and template imports
"migrations/versions/*" = ["E501", "F401"]  # the template always imports sqlmodel

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
cache_dir = "/tmp/pytest-cache"
