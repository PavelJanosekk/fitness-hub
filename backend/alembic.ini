[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s
path_separator = os
# Sequential ids: alembic revision --autogenerate --rev-id 0002 -m "add gym tables"
file_template = %%(rev)s_%%(slug)s
# Left empty on purpose: migrations/env.py takes the URL from app settings
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
