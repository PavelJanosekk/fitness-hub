name: fitness-hub

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      target: prod
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    # Bound to localhost only: phones reach it through `tailscale serve` (HTTPS), never plain HTTP on the LAN
    ports:
      - "127.0.0.1:${APP_PORT:-8010}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Daily pg_dump into BACKUP_DIR (default ./data/backups) with rotation (scripts/backup.sh); restore: docs/operations.md
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    # Host user, so the dumps are yours to copy off the server (umask 077: readable only by you)
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    entrypoint: ["/scripts/backup.sh"]
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      TZ: ${APP_TZ:-Europe/Prague}
      BACKUP_HOUR: ${BACKUP_HOUR:-3}
    volumes:
      - ./scripts/backup.sh:/scripts/backup.sh:ro
      - ${BACKUP_DIR:-./data/backups}:/backups
    depends_on:
      db:
        condition: service_healthy
    # Unhealthy when the newest dump is over 26 h old
    healthcheck:
      test: ["CMD-SHELL", "find /backups/daily -name '*.dump' -mmin -1560 | grep -q ."]
      interval: 10m
      timeout: 10s
      start_period: 2m
      start_interval: 10s

volumes:
  pgdata:
